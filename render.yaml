services:
  - type: web
    name: aparaitech-student-mail-blast
    runtime: node
    plan: free # or starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
