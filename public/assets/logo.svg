<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <!-- Brand Gradient -->
    <linearGradient id="aparaitechGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="badgeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Geometric AI Tech Symbol Icon -->
  <g transform="translate(15, 15)" filter="url(#subtleShadow)">
    <!-- Hexagonal / Shield Base -->
    <rect x="0" y="0" width="90" height="90" rx="20" fill="url(#badgeGlow)" />
    
    <!-- Dynamic Circuit & AI Geometry Overlay -->
    <path d="M45 18 L70 32 L70 60 L45 74 L20 60 L20 32 Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />
    
    <!-- Stylized "A" and Nodes -->
    <path d="M45 24 L62 58 L54 58 L49 47 L41 47 L36 58 L28 58 Z" fill="#ffffff" />
    <path d="M42 42 L48 42 L45 34 Z" fill="url(#badgeGlow)" />
    
    <!-- Tech Pulse Nodes -->
    <circle cx="45" cy="18" r="4" fill="#38bdf8" />
    <circle cx="70" cy="32" r="4" fill="#38bdf8" />
    <circle cx="70" cy="60" r="4" fill="#38bdf8" />
    <circle cx="45" cy="74" r="4" fill="#38bdf8" />
    <circle cx="20" cy="60" r="4" fill="#38bdf8" />
    <circle cx="20" cy="32" r="4" fill="#38bdf8" />
  </g>

  <!-- Brand Typography -->
  <!-- Main Title -->
  <text x="125" y="60" font-family="'Poppins', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="0.5" fill="#ffffff">
    APARAI<tspan fill="#38bdf8">TECH</tspan>
  </text>

  <!-- Tagline / Subtitle -->
  <text x="126" y="85" font-family="'Poppins', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="3" fill="#94a3b8" text-transform="uppercase">
    AI &amp; IT Solutions &bull; Recruitment
  </text>
</svg>
